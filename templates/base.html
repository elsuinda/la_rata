<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}LA RATA{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('inicio') }}" class="logo">🐀 LA RATA</a>
    <nav>
      <a href="{{ url_for('noticias') }}">Noticias</a>
      <a href="{{ url_for('perfiles') }}">Perfiles</a>
    </nav>
  </header>
  <main>
  {% block contenido %}{% endblock %}
  </main>
  <footer>
    <p>LA RATA · herramienta de uso local para investigación periodística y OSINT ético. Ver <a href="https://github.com/elsuinda/la_rata#aviso-legal-y-uso-%C3%A9tico">aviso legal</a>.</p>
  </footer>
</body>
</html>
